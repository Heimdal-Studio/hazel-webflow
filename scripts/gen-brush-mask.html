<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brush mask generator — painterly reveal</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; background: #16130f; color: #e9e3d8; }
      header { padding: 16px 20px; border-bottom: 1px solid #2c271f; }
      h1 { font-size: 15px; margin: 0; font-weight: 600; }
      p.sub { margin: 4px 0 0; color: #9a9484; font-size: 12px; }
      main { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 20px; align-items: start; }
      .panel label { display: block; margin: 0 0 12px; }
      .panel span { display: flex; justify-content: space-between; color: #b8b1a2; font-size: 12px; margin-bottom: 4px; }
      .panel input[type="range"] { width: 100%; }
      .row { display: flex; gap: 8px; margin-top: 8px; }
      button { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid #3a342a; background: #221e18; color: #f0eadf; cursor: pointer; font: inherit; }
      button:hover { background: #2c271f; }
      .preview { background-color: #0c0a08; background-image: repeating-conic-gradient(#0c0a08 0% 25%, #131009 0% 50%); background-size: 24px 24px; border: 1px solid #2c271f; border-radius: 10px; overflow: hidden; }
      canvas { display: block; width: 100%; height: auto; }
      .metrics { margin-top: 10px; font-size: 12px; color: #9a9484; }
      .metrics b { color: #e9e3d8; }
      code { color: #d7b98a; }
    </style>
  </head>
  <body>
    <header>
      <h1>Brush mask generator</h1>
      <p class="sub">
        Grayscale mask for the painterly reveal — white keeps the image, black dissolves to background.
        Tune, <b>Download PNG</b>, then use it as the <code>data-hero-mask</code> in your
        <code>[data-painterly-reveal]</code> embed (or upload it via the hero-gl tool).
      </p>
    </header>
    <main>
      <div class="panel">
        <label><span>Strokes <b id="v-strokes"></b></span><input id="strokes" type="range" min="3" max="12" step="1" /></label>
        <label><span>Angle <b id="v-angle"></b>°</span><input id="angleDeg" type="range" min="0" max="360" step="5" /></label>
        <label><span>Coverage <b id="v-coverage"></b></span><input id="coverage" type="range" min="0.8" max="1.8" step="0.05" /></label>
        <label><span>Roughness <b id="v-roughness"></b></span><input id="roughness" type="range" min="0.2" max="1.5" step="0.05" /></label>
        <label><span>Grain <b id="v-grain"></b></span><input id="grain" type="range" min="0" max="1.5" step="0.05" /></label>
        <label><span>Seed <b id="v-seed"></b></span><input id="seed" type="range" min="1" max="60" step="1" /></label>
        <div class="row">
          <button id="reseed" type="button">Reseed</button>
          <button id="download" type="button">Download PNG</button>
        </div>
        <div class="metrics" id="metrics"></div>
      </div>
      <div class="preview"><canvas id="mask"></canvas></div>
    </main>

    <script type="module">
      import { drawBrushMask, analyzeMask, DEFAULT_MASK_OPTS } from "./brush-mask.js";

      const canvas = document.getElementById("mask");
      const ids = ["strokes", "angleDeg", "coverage", "roughness", "grain", "seed"];
      const vlabels = { strokes: "v-strokes", angleDeg: "v-angle", coverage: "v-coverage", roughness: "v-roughness", grain: "v-grain", seed: "v-seed" };

      // seed inputs from defaults
      for (const id of ids) document.getElementById(id).value = DEFAULT_MASK_OPTS[id];

      function opts() {
        const o = { ...DEFAULT_MASK_OPTS };
        for (const id of ids) o[id] = Number(document.getElementById(id).value);
        return o;
      }

      function render() {
        const o = opts();
        for (const id of ids) document.getElementById(vlabels[id]).textContent = o[id];
        drawBrushMask(canvas, o);

        // self-check (ponytail runnable check): the mask must have real coverage
        // and roughly one ink band per stroke.
        const { coverage, bands } = analyzeMask(canvas, o);
        console.assert(coverage > 0.15 && coverage < 0.92, `mask coverage out of range: ${coverage.toFixed(3)}`);
        console.assert(bands >= o.strokes - 3, `too few ink bands: ${bands} for ${o.strokes} strokes`);
        document.getElementById("metrics").innerHTML =
          `coverage <b>${(coverage * 100).toFixed(0)}%</b> · ink bands <b>${bands}</b> · ${canvas.width}×${canvas.height}`;
      }

      for (const id of ids) document.getElementById(id).addEventListener("input", render);
      document.getElementById("reseed").addEventListener("click", () => {
        document.getElementById("seed").value = 1 + Math.floor(Math.random() * 60);
        render();
      });
      document.getElementById("download").addEventListener("click", () => {
        canvas.toBlob((blob) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `brush-mask-${opts().strokes}s-${opts().angleDeg}deg.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 0);
        }, "image/png");
      });

      // expose for headless generation (smoke test / MCP)
      window.__mask = { canvas, render, opts, dataUrl: () => canvas.toDataURL("image/png") };
      render();
    </script>
  </body>
</html>
