<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painterly reveal — smoke test</title>
    <!-- GSAP + plugins, as the real Webflow site loads them (the bundle registers
         these at top level; without them main.js throws before init runs). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <style>
      body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
      .spacer { height: 130vh; display: flex; align-items: center; justify-content: center; color: #b7b0a4; background: #f7f4ef; font: 13px/1 monospace; letter-spacing: 0.2em; }
      .sec { position: relative; height: 82vh; display: flex; align-items: center; justify-content: center; background: #141210; overflow: hidden; }
      /* One attribute on the image is all it takes. */
      .sec .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
      .sec .content { position: relative; z-index: 2; text-align: center; }
      .sec .tag { color: #d98a5a; font: 600 12px/1 ui-monospace, monospace; letter-spacing: 0.22em; margin: 0 0 14px; }
      .sec h2 { color: #f4efe6; font-size: 44px; letter-spacing: -0.02em; margin: 0; font-family: Georgia, "Times New Roman", serif; }
    </style>
  </head>
  <body>
    <div class="spacer">SCROLL DOWN &#8595;</div>
    <section class="sec">
      <img class="bg" data-painterly-reveal src="/scripts/block.png" alt="" />
      <div class="content">
        <p class="tag">COMPLIANCE AND SECURITY</p>
        <h2>We protect and respect your data</h2>
      </div>
    </section>
    <div class="spacer">END</div>

    <!-- gsap/plugins are global from the CDN tags above; jQuery stub keeps the UMD happy. -->
    <script>
      window.$ = window.$ || (() => {});
    </script>
    <script src="/dist/main.js" onload="window.__smokeReady = true"></script>
  </body>
</html>
