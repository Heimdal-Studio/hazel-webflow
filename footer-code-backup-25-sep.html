<script defer src="https://unpkg.com/lenis@1.3.1/dist/lenis.min.js"></script>


<script>
  (function () {
    var LOCALHOST_URL = [
      'https://localhost:4012/@vite/client',
      'https://localhost:4012/src/main.js',
      'https://localhost:4012/src/gl/embed.js',
    ]
    var PROD_URL = [
      'https://hazel-webflow.vercel.app/main.js',
      'https://hazel-webflow.vercel.app/gl.js',
    ]

    function createScripts(arr, isDevMode) {
      return arr.map(function (url) {
        var s = document.createElement('script')
        s.src = url
        if (isDevMode) s.type = 'module'
        return s
      })
    }

    function insertScript(scriptArr) {
      scriptArr.forEach(function (script) {
        document.body.appendChild(script)
      })
    }

    // Dev mode is opt-in: visiting any page with ?dev=1 enables it for this browser, ?dev=0 disables it.
    var params = new URLSearchParams(location.search)
    if (params.has('dev')) {
      if (params.get('dev') === '0') localStorage.removeItem('hazel-dev')
      else localStorage.setItem('hazel-dev', '1')
    }

    if (localStorage.getItem('hazel-dev') !== '1') {
      insertScript(createScripts(PROD_URL, false))
      return
    }

    fetch(LOCALHOST_URL[0], {})
      .then(function () { insertScript(createScripts(LOCALHOST_URL, true)) })
      .catch(function () { insertScript(createScripts(PROD_URL, false)) })
  })()
</script>
<script>
  {
    let lenis;

    const lenisMQ = window.matchMedia("(max-width: 767px)");
    // Safari: native scroll is compositor-threaded; Lenis forces it through JS
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);   // ← new
    const lenisRaf = (time) => lenis?.raf(time * 1000);

    const startLenis = () => {
      if (lenis || lenisMQ.matches || isSafari) return;                            // ← changed
      lenis = new Lenis({ duration: 0.2 });
      window.lenis = lenis; // debuggable from console                              // ← new
      lenis.on("scroll", ScrollTrigger.update);
      gsap.ticker.add(lenisRaf);
    };
    const stopLenis = () => {
      if (!lenis) return;
      gsap.ticker.remove(lenisRaf);
      lenis.destroy();
      lenis = null;
      window.lenis = null;
    };
    lenisMQ.addEventListener?.("change", (e) => (e.matches ? stopLenis() : startLenis()));

    const initScroll = () => {
      // Skip refresh on the mobile URL-bar show/hide (height-only resize).
      ScrollTrigger.config({ ignoreMobileResize: true });
      gsap.ticker.lagSmoothing(0);

      startLenis();

      $("[data-lenis-start]").on("click", () => lenis?.start());
      $("[data-lenis-stop]").on("click", () => lenis?.stop());
      $("[data-lenis-toggle]").on("click", function () {
        $(this).toggleClass("stop-scroll");
        $(this).hasClass("stop-scroll") ? lenis?.stop() : lenis?.start();
      });
    };

    function initGsapGlobal() {
      initScroll();

      const sendGsapEvent = () =>
        window.dispatchEvent(new CustomEvent("GSAPReady", { detail: { lenis } }));

      if (document.fonts.status === "loaded") sendGsapEvent();
      else document.fonts.ready.then(sendGsapEvent);

      queueMicrotask(() => {
        document.querySelectorAll("[data-start='hidden']").forEach((el) => {
          const delay = parseFloat(el.getAttribute("data-start-delay")) || 0.4;
          gsap.to(el, { autoAlpha: 1, duration: 0.4, delay });
        });
      });
    }

    const documentReady =
      document.readyState === "complete" || document.readyState === "interactive";
    if (documentReady) initGsapGlobal();
    else addEventListener("DOMContentLoaded", () => initGsapGlobal());
  }
</script>
